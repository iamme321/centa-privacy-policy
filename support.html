<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CENTA Support</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d0620;
    color: #f5f3fa;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
  }
  .card {
    max-width: 480px;
    text-align: center;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 0.5rem;
  }
  p {
    color: #c9c3d9;
    line-height: 1.6;
  }
  a.email {
    display: inline-block;
    margin-top: 1.5rem;
    padding: 12px 28px;
    background: #6d3fd6;
    color: #fff;
    text-decoration: none;
    border-radius: 999px;
    font-weight: 600;
  }
  a.email:hover {
    background: #5a32b3;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>CENTA Support</h1>
    <p>Need help, have feedback, or a question about your account or subscription? We're happy to help.</p>
    <a class="email" href="mailto:centa.wellness@gmail.com">centa.wellness@gmail.com</a>
    <p style="margin-top: 2rem; font-size: 0.9rem; color: #8a83a3;">We aim to respond within 1–2 business days.</p>
  </div>
</body>
</html>
